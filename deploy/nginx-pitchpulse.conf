# Reverse proxy del Nginx del HOST hacia el contenedor de PitchPulse.
#
# Se instala en /etc/nginx/conf.d/pitchpulse.conf
#
# El contenedor publica su puerto SOLO en 127.0.0.1:3000, asi que este Nginx es
# el unico camino posible desde Internet.
#
# Contexto verificado del servidor:
#   - nginx 1.20.1 (paquete de Oracle Linux), systemd activo
#   - /etc/nginx/conf.d esta vacio; el :80 servia la pagina de fabrica
#   - SELinux en Enforcing  ->  requiere httpd_can_network_connect=on
#     (lo aplica deploy/provision.sh; sin eso esto devuelve 502)

server {
    # default_server: toma el puerto 80 y desplaza al server block de fabrica
    # de /etc/nginx/nginx.conf, que sirve /usr/share/nginx/html. Se declara
    # explicito para no depender del orden de los include.
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # No anunciar la version de nginx en las respuestas ni en las paginas de error.
    server_tokens off;

    # El unico cuerpo grande es el JSON de una sincronizacion.
    client_max_body_size 2m;

    # Cabeceras de seguridad. No se agrega HSTS: sin TLS no tiene sentido y
    # haria que el navegador exija HTTPS a un sitio que no lo ofrece.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js comprime por su cuenta (compress: true por defecto). Se prefiere
    # que comprima Nginx y que Next devuelva sin comprimir, para que no haya
    # duda sobre quien lo hace.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Todo va al mismo proceso de Next. SUS PAGINAS Y SU API SON EL MISMO
    # SERVICIO: /api/* son Route Handlers del App Router, no un backend aparte.
    # No hay a quien mas derivar.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Se quita el Accept-Encoding del cliente para que Next devuelva en
        # claro y comprima Nginx (ver bloque gzip de arriba).
        proxy_set_header Accept-Encoding "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Una sincronizacion contra el proveedor real puede tardar: se le da aire
    # para que el proxy no corte la conexion a mitad de camino.
    location /api/sync {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # Lo consulta deploy.sh en cada despliegue: no ensucia el access_log.
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
